services:
  - type: web
    name: pulse-premium
    env: python
    plan: starter
    rootDir: .
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 8 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ACCESS_NUMBERS_FILE
        value: /etc/secrets/numbers.txt
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
      - key: SCAN_COMPUTE_EVERY_SEC
        value: "3"
      - key: SEED_DAYS_5M
        value: "45"
      - key: SEED_DAYS_DAILY
        value: "120"
