# Optional Render Blueprint. Live Kite feeds should use an always-on service.
services:
  - type: web
    name: kite-neonflow
    runtime: python
    plan: free  # Demo/test only: spins down when idle. Select paid always-on for ticks.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: MODE
        value: demo
      - key: FEED
        value: ticks
      - key: POLL_SECONDS
        value: "2"
