# Render Blueprint for KiteNeonFlow V7.
# The free plan is only for DEMO testing; it spins down when idle.
# Do not expose live Kite market data publicly. Restrict access and obtain
# the required rights before using live feeds beyond authorised personal use.
services:
  - type: web
    name: kite-neonflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODE
        value: demo
      - key: FEED
        value: ticks
      - key: POLL_SECONDS
        value: "2"
